<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contato · G.R.E.S. Estrela de Prata</title>
  <meta name="description" content="Diretoria, responsáveis por segmento e Instagram da Estrela de Prata.">
  <meta name="theme-color" content="#040f2e">
  <link rel="icon" href="img/estrela.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/logo-estandarte.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/dados.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-pagina="contato">
  <header class="topo" id="topo"></header>

  <main>
    <section class="cabeca">
      <div class="container container--estreito">
        <h1>Contato</h1>
        <p>Fale com a diretoria ou com cada segmento.</p>
      </div>
    </section>
    <div class="faixa"></div>
    <div class="container container--estreito conteudo">
      <a class="insta" data-instagram href="#" target="_blank" rel="noopener">
        <span class="insta__icone" data-icone="instagram"></span>
        <span class="linha__txt"><strong>Siga a Estrela no Instagram</strong><span data-instagram-user></span></span>
        <span class="seta-linha" data-icone="direita"></span>
      </a>
      <a class="btn btn--ouro btn--largo" id="whats-geral" href="#" target="_blank" rel="noopener" hidden style="margin-top:12px">WhatsApp da escola</a>

      <h2 class="titulo-secao">Diretoria</h2>
      <div id="diretoria"></div>

      <h2 class="titulo-secao">Segmentos</h2>
      <div id="por-segmento"></div>
    </div>
  </main>

  <footer class="rodape" id="rodape"></footer>
  <nav class="barra-inferior" id="barra-inferior"></nav>
</body>
</html>
