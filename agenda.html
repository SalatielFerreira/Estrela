<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Agenda · G.R.E.S. Estrela de Prata</title>
  <meta name="description" content="Agenda de ensaios e eventos da Estrela de Prata.">
  <meta name="theme-color" content="#040f2e">
  <link rel="icon" href="img/estrela.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/logo-estandarte.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/dados.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-pagina="agenda">
  <header class="topo" id="topo"></header>

  <main>
    <section class="cabeca">
      <div class="container container--estreito">
        <h1>Agenda</h1>
        <p>Toque no calendário de cada data para salvar no seu celular.</p>
      </div>
    </section>
    <div class="faixa"></div>
    <div class="container container--estreito conteudo">
      <div class="chips" id="chips" role="group" aria-label="Filtrar" hidden>
        <button class="chip" type="button" data-filtro="todos" aria-pressed="true">Todos</button>
        <button class="chip" type="button" data-filtro="ensaio" aria-pressed="false">Ensaios</button>
        <button class="chip" type="button" data-filtro="evento" aria-pressed="false">Eventos</button>
      </div>
      <div id="agenda"></div>
    </div>
  </main>

  <footer class="rodape" id="rodape"></footer>
  <nav class="barra-inferior" id="barra-inferior"></nav>
</body>
</html>
